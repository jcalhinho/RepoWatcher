# Categories for the release notes GitHub generates from merged pull requests.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: New features
      labels: ["enhancement", "feature"]
    - title: Connectors
      labels: ["connector"]
    - title: Model prices
      labels: ["pricing"]
    - title: Bug fixes
      labels: ["bug"]
    - title: Security
      labels: ["security"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
