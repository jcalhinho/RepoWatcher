[package]
name = "repowatcher-agent-observer"
version = "0.1.1"
description = "Local observability for coding-agent sessions"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
chrono.workspace = true
session-events = { path = "../../../crates/session-events" }
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["net"] }
serde_json = "1"
uuid.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
sha2.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
